name: Validate native nut handle carry
on:
  push:
    branches: [task/robosuite-nut-handle-carry-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - name: Build ALE base image
        working-directory: vendor/ale
        run: images/build.sh container-ubuntu22
      - name: Lint and measure null-anchor reference
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/ale
          VIRTUAL_ENV= uv run ale lint ../../tasks/arm/robosuite_nut_handle_carry
          VIRTUAL_ENV= DOCKER_HOST=unix:///var/run/docker.sock uv run ale validate ../../tasks/arm/robosuite_nut_handle_carry --runs-dir /tmp/ale-nut-carry-runs 2>&1 | tee /tmp/validate-nut-carry.log
      - name: Print raw reference metrics
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('/tmp/ale-nut-carry-runs').rglob('result.json'))
          if not paths:
              raise SystemExit('No ALE result.json found')
          for path in paths:
              data = json.loads(path.read_text())
              print('RAW_ALE_RESULT', path, json.dumps(data.get('metrics', data), sort_keys=True)[:5000], flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nut-handle-carry-anchor-measurement
          path: |
            /tmp/validate-nut-carry.log
            /tmp/ale-nut-carry-runs
