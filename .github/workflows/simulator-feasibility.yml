name: Simulator feasibility probe

on:
  push:
    branches: [probe/simulator-task-feasibility]

jobs:
  robosuite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU renderer and robosuite
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev ffmpeg
          python -m pip install --upgrade pip
          python -m pip install mujoco==3.3.7 robosuite==1.5.2 pillow psutil
      - name: Probe NutAssemblySquare physics and offscreen rendering
        env:
          MUJOCO_GL: osmesa
        run: |
          python - <<'PY'
          import json, os, resource, time
          from pathlib import Path
          import numpy as np
          from PIL import Image
          import robosuite as suite

          t0 = time.perf_counter()
          env = suite.make(
              env_name="NutAssemblySquare",
              robots="Panda",
              has_renderer=False,
              has_offscreen_renderer=True,
              use_camera_obs=True,
              camera_names=["agentview", "robot0_eye_in_hand"],
              camera_heights=256,
              camera_widths=256,
              camera_depths=True,
              reward_shaping=False,
              control_freq=20,
              horizon=200,
          )
          obs = env.reset()
          reset_s = time.perf_counter() - t0
          frames = []
          step_t0 = time.perf_counter()
          low, high = env.action_spec
          rng = np.random.default_rng(7)
          for i in range(200):
              action = rng.uniform(low, high) * 0.08
              obs, reward, done, info = env.step(action)
              if i in (0, 99, 199):
                  frames.append(obs["agentview_image"][::-1].copy())
          step_s = time.perf_counter() - step_t0
          Image.fromarray(np.concatenate(frames, axis=1)).save("robosuite_probe.png")
          result = {
              "simulator": "robosuite",
              "version": suite.__version__,
              "environment": "NutAssemblySquare",
              "action_dim": int(low.size),
              "observation_keys": list(obs.keys()),
              "reset_seconds": reset_s,
              "steps": 200,
              "step_seconds": step_s,
              "steps_per_second": 200 / step_s,
              "max_rss_mb": resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024,
              "render_shape": list(frames[0].shape),
              "image_bytes": Path("robosuite_probe.png").stat().st_size,
          }
          print(json.dumps(result, indent=2))
          Path("robosuite_probe.json").write_text(json.dumps(result, indent=2))
          env.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: robosuite-probe
          path: robosuite_probe.*

  fetch-slide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU renderer and Gymnasium Robotics
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev ffmpeg
          python -m pip install --upgrade pip
          python -m pip install mujoco==3.3.7 gymnasium-robotics==1.4.2 pillow psutil
      - name: Probe FetchSlide physics and offscreen rendering
        env:
          MUJOCO_GL: osmesa
        run: |
          python - <<'PY'
          import json, resource, time
          from pathlib import Path
          import gymnasium as gym
          import gymnasium_robotics
          import numpy as np
          from PIL import Image

          t0 = time.perf_counter()
          env = gym.make("FetchSlide-v4", render_mode="rgb_array", max_episode_steps=50)
          obs, info = env.reset(seed=7)
          reset_s = time.perf_counter() - t0
          frames = [env.render()]
          step_t0 = time.perf_counter()
          rng = np.random.default_rng(7)
          for i in range(50):
              obs, reward, terminated, truncated, info = env.step(rng.uniform(-0.1, 0.1, env.action_space.shape))
              if i in (24, 49):
                  frames.append(env.render())
          step_s = time.perf_counter() - step_t0
          Image.fromarray(np.concatenate(frames, axis=1)).save("fetch_slide_probe.png")
          result = {
              "simulator": "Gymnasium Robotics",
              "version": gymnasium_robotics.__version__,
              "environment": "FetchSlide-v4",
              "action_dim": int(env.action_space.shape[0]),
              "observation_shapes": {k: list(v.shape) for k, v in obs.items()},
              "reset_seconds": reset_s,
              "steps": 50,
              "step_seconds": step_s,
              "steps_per_second": 50 / step_s,
              "max_rss_mb": resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024,
              "render_shape": list(frames[0].shape),
              "image_bytes": Path("fetch_slide_probe.png").stat().st_size,
          }
          print(json.dumps(result, indent=2))
          Path("fetch_slide_probe.json").write_text(json.dumps(result, indent=2))
          env.close()
          PY
      - name: Probe FetchSlide timed strike baseline
        env:
          MUJOCO_GL: osmesa
        run: |
          python - <<'PY'
          import gymnasium as gym
          import gymnasium_robotics
          import numpy as np
          gym.register_envs(gymnasium_robotics)
          def clipped(delta):
              return np.clip(np.asarray(delta) / 0.05, -1, 1)
          for behind in (0.05, 0.08, 0.11):
              for strike_steps in (6, 10, 14):
                  successes = 0
                  errors = []
                  for seed in range(10):
                      env = gym.make("FetchSlide-v4", max_episode_steps=50)
                      obs, _ = env.reset(seed=seed + 100)
                      phase = 0
                      strikes = 0
                      for t in range(50):
                          gripper = obs["observation"][:3]
                          puck = obs["achieved_goal"]
                          goal = obs["desired_goal"]
                          direction = goal[:2] - puck[:2]
                          direction /= max(np.linalg.norm(direction), 1e-9)
                          target = puck.copy()
                          target[:2] -= behind * direction
                          if phase == 0:
                              target[2] += 0.11
                              if np.linalg.norm(gripper-target) < 0.018: phase = 1
                          elif phase == 1:
                              target[2] = puck[2] + 0.005
                              if np.linalg.norm(gripper-target) < 0.015: phase = 2
                          elif phase == 2:
                              target[:2] = gripper[:2] + direction * 0.05
                              target[2] = puck[2] + 0.005
                              strikes += 1
                              if strikes >= strike_steps: phase = 3
                          else:
                              target = gripper.copy()
                              target[2] += 0.05
                          act = np.r_[clipped(target-gripper), 0.0]
                          obs, rew, term, trunc, info = env.step(act)
                      errors.append(float(np.linalg.norm(obs["achieved_goal"]-obs["desired_goal"])))
                      successes += errors[-1] < 0.05
                      env.close()
                  print("STRIKE", behind, strike_steps, successes, "mean_error", np.mean(errors), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fetch-slide-probe
          path: fetch_slide_probe.*
