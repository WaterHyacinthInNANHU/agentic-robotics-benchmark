name: Probe native nut handle carry
on:
  push:
    branches: [probe/nut-handle-carry]
permissions:
  contents: read
jobs:
  carry:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install robosuite task dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev
          python -m pip install -r tasks/arm/robosuite_square_nut_assembly/image/requirements.txt
      - name: Evaluate public-observation recovery controller
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python candidate_notes/simulator_task_probe/nut_handle_carry_probe.py
