name: Trial native nut handle carry blind agents
on:
  push:
    branches: [trial/robosuite-nut-handle-carry-blind]
permissions:
  contents: read
jobs:
  blind:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        agent: ["01", "02"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install robosuite task dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev
          python -m pip install -r tasks/arm/robosuite_nut_handle_carry/image/requirements.txt
      - name: Stage frozen submission at its declared path
        run: |
          mkdir -p /tmp/nut_handle_carry_blind_${{ matrix.agent }}/submission
          cp candidate_notes/simulator_task_probe/nut_carry_blind_${{ matrix.agent }}/* /tmp/nut_handle_carry_blind_${{ matrix.agent }}/submission/
      - name: Evaluate frozen independent agent on 40 hidden scenes
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python candidate_notes/simulator_task_probe/evaluate_blind_nut_carry.py candidate_notes/simulator_task_probe/nut_carry_blind_${{ matrix.agent }} --episodes 40
