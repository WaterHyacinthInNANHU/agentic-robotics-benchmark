name: Fetch precision push task smoke
on:
  push:
    branches: [probe/simulator-task-feasibility]
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev
          python -m pip install -r tasks/arm/fetch_precision_push/image/requirements.txt
      - name: Evaluate 2-20 mm precision on fresh MuJoCo seeds
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python candidate_notes/simulator_task_probe/fetch_push_two_waypoint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-push-task-probe
          path: |
            fetch_push_task_probe.json
            fetch_push_observation.png
