name: Render native timed nut samples
on:
  push:
    branches: [probe/nut-fast-insert]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev
          python -m pip install -r tasks/arm/robosuite_square_nut_assembly/image/requirements.txt
      - name: Render successful and failed simulator trajectories
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python candidate_notes/simulator_task_probe/render_timed_nut_samples.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timed-nut-success-failure-samples
          path: /tmp/timed-nut-visuals
