name: Square nut candidate smoke
on:
  push:
    branches: [probe/simulator-task-feasibility]
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev
          python -m pip install -r tasks/arm/robosuite_square_nut_assembly/image/requirements.txt
      - name: Run actual MuJoCo reference candidate
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "tasks/arm/robosuite_square_nut_assembly/setup/payload")
          from square_nut_env import SquareNutEpisode
          sys.path.insert(0, "tasks/arm/robosuite_square_nut_assembly/oracle")
          from controller import action
          results = []
          for height in (0.055, 0.065, 0.075, 0.085, 0.095, 0.105):
              world = SquareNutEpisode(11, render=False)
              start_nut = world.raw["SquareNut_pos"].copy()
              snap = {}
              for t in range(106):
                  obs = world.observe()
                  a = action(t, obs)
                  if 38 <= t < 65:
                      a[2] = max(-1.0, min(1.0, 9 * (obs["handle_pos"][2] + height - obs["eef_pos"][2])))
                  if t in (64, 81, 105):
                      snap[t] = {
                          "eef": obs["eef_pos"],
                          "handle": obs["handle_pos"],
                          "gripper": obs["gripper_qpos"],
                          "grasp": bool(world.env._check_grasp(gripper=world.env.robots[0].gripper, object_geoms=world.env.nuts[0].contact_geoms)),
                          "nut_lift": float(world.raw["SquareNut_pos"][2] - start_nut[2])
                      }
                  world.step(a)
              results.append({"height":height,"snap":snap})
              world.close()
          print("GRASP_SWEEP=" + json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: square-nut-policy-probe
          path: square_nut_policy_probe.json
