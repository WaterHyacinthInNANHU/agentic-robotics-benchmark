name: Validate keyed nut peg assembly
on:
  push:
    branches: [task/keyed-nut-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/keyed-nut-peg-assembly
          path: submitted
      - uses: actions/checkout@v4
        with:
          repository: Grounded-Intelligence-Initiative/agentic-robotics-benchmark
          ref: main
          submodules: recursive
          path: benchmark
      - name: Stage submitted task into current upstream
        run: |
          cp -a submitted/tasks/arm/keyed_nut_peg_assembly benchmark/tasks/arm/
      - uses: astral-sh/setup-uv@v6
      - name: Build ALE base image
        working-directory: benchmark/vendor/ale
        run: images/build.sh container-ubuntu22-base ale-qemu-runner
      - name: Lint and validate
        shell: bash
        run: |
          set -euo pipefail
          cd benchmark
          uv run python scripts/lint_domain.py tasks/arm/keyed_nut_peg_assembly
          cd vendor/ale
          VIRTUAL_ENV= uv run ale lint ../../tasks/arm/keyed_nut_peg_assembly
          VIRTUAL_ENV= DOCKER_HOST=unix:///var/run/docker.sock uv run ale validate ../../tasks/arm/keyed_nut_peg_assembly --runs-dir /tmp/ale-keyed-runs 2>&1 | tee /tmp/validate-keyed.log
      - name: Print verifier metrics and grader stderr
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('/tmp/ale-keyed-runs').rglob('verification.json')):
              print('VERIFICATION', path, json.dumps(json.loads(path.read_text()), sort_keys=True)[:5000], flush=True)
          for path in sorted(Path('/tmp/ale-keyed-runs').rglob('trace.execution.jsonl')):
              for line in path.read_text().splitlines():
                  if '[grader]' in line or 'Traceback' in line:
                      print('TRACE', path.parent.name, line[:3000], flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyed-nut-validation
          path: |
            /tmp/validate-keyed.log
            /tmp/ale-keyed-runs
