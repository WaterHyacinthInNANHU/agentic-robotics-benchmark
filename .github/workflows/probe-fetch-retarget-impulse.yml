name: Probe native Fetch late impulse
on:
  push:
    branches: [probe/fetch-retarget-impulse]
permissions:
  contents: read
jobs:
  impulse:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native MuJoCo task dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev
          python -m pip install -r tasks/arm/fetch_precision_retarget/image/requirements.txt
      - name: Compare reference and frozen agent under late physical impulse
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python candidate_notes/simulator_task_probe/fetch_impulse_probe.py
