name: Validate Fetch precision retarget

on:
  push:
    branches:
      - task/fetch-precision-retarget-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - name: Build ALE base image
        working-directory: vendor/ale
        run: images/build.sh container-ubuntu22
      - name: Lint and validate committed anchor
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/ale
          VIRTUAL_ENV= uv run ale lint ../../tasks/arm/fetch_precision_retarget
          VIRTUAL_ENV= DOCKER_HOST=unix:///var/run/docker.sock uv run ale validate ../../tasks/arm/fetch_precision_retarget --runs-dir /tmp/ale-runs-anchored 2>&1 | tee /tmp/validate-anchored.log
      - name: Show raw validation metrics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('/tmp/ale-runs-anchored').rglob('result.json'))
          if not paths:
              raise SystemExit('No ALE result.json found')
          for path in paths:
              data = json.loads(path.read_text())
              print('RAW_ALE_RESULT', path, json.dumps(data.get('metrics', data), sort_keys=True)[:5000], flush=True)
          PY
      - name: Domain lint
        run: |
          uv sync
          uv run python scripts/lint_domain.py tasks/arm/fetch_precision_retarget
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-precision-retarget-validation
          path: |
            /tmp/validate-anchored.log
            /tmp/ale-runs-anchored
            tasks/arm/fetch_precision_retarget/verify/anchor.json
